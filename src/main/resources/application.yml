spring:
  application:
    name: polizas-api
  datasource:
    url: jdbc:h2:mem:polizas;DB_CLOSE_DELAY=-1
  jpa:
    hibernate:
      ddl-auto: create-drop
    defer-datasource-initialization: true
    open-in-view: false
  mvc:
    problemdetails:
      enabled: true
  h2:
    console:
      enabled: true

polizas:
  api-key: "123456"
  ipc: 0.05
